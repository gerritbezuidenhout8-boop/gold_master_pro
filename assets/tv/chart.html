<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Chart engine: TradingView Lightweight Charts v5.2.0 (Apache-2.0)
     https://github.com/tradingview/lightweight-charts -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; overflow: hidden; }
  #c { position: absolute; inset: 0; }
  #readout {
    position: absolute; left: 10px; top: 8px; z-index: 3; pointer-events: none;
    font: 600 11px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #8E8A7E; letter-spacing: 0.3px; display: none;
  }
  #readout .kv { color: #E3B84C; }
  #readout .dv { color: #35CDAC; }
  /* Bar-close countdown, sat on the price axis directly under the live price
     label — the position a trader already reads it in. Positioned in JS from
     priceToCoordinate, because the price scale has no slot to render into. */
  #countdown {
    position: absolute; right: 0; z-index: 4; pointer-events: none;
    display: none; box-sizing: border-box;
    padding: 2px 4px; min-width: 58px; text-align: center;
    font: 700 11px/1.25 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0A0A0B; background: #25C685;
  }
  #countdown.closing { background: #E5484D; color: #FFFFFF; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="c"></div>
<div id="readout"></div>
<div id="countdown"></div>
<script>
(function () {
  var LWC = LightweightCharts;
  var chart = LWC.createChart(document.getElementById('c'), {
    autoSize: true,
    layout: {
      background: { type: 'solid', color: '#0A0A0B' },
      textColor: '#8E8A7E',
      panes: { separatorColor: '#26211A', enableResize: false }
    },
    grid: {
      vertLines: { color: '#16130E' },
      horzLines: { color: '#16130E' }
    },
    crosshair: { mode: 0 },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#26211A' },
    rightPriceScale: { borderColor: '#26211A' }
  });

  var candles = chart.addSeries(LWC.CandlestickSeries, {
    upColor: '#25C685', downColor: '#E5484D',
    wickUpColor: '#25C685', wickDownColor: '#E5484D',
    borderVisible: false
  });
  var volume = chart.addSeries(LWC.HistogramSeries, {
    priceFormat: { type: 'volume' },
    priceScaleId: 'vol',
    lastValueVisible: false,
    priceLineVisible: false
  });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });

  var smmaColors = ['#F2CC5A', '#35CDAC', '#B48EE3'];
  var smma = smmaColors.map(function (col) {
    return chart.addSeries(LWC.LineSeries, {
      color: col, lineWidth: 1,
      priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false
    });
  });

  var stochK = null, stochD = null, markersApi = null, priceLines = [];

  // --- bar-close countdown -------------------------------------------------
  // Driven by an in-page timer rather than a push from Flutter: it has to tick
  // every second whether or not price moved, and re-pushing the whole payload
  // once a second would be wasteful.
  var barCloseAt = null;   // epoch seconds when the forming bar closes
  var lastClose = null;    // price the label is pinned to
  var cdEl = document.getElementById('countdown');

  function fmtCountdown(sec) {
    if (sec < 0) sec = 0;
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = Math.floor(sec % 60);
    function p(v) { return v < 10 ? '0' + v : '' + v; }
    return h > 0 ? p(h) + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
  }

  function drawCountdown() {
    if (barCloseAt == null || lastClose == null) { cdEl.style.display = 'none'; return; }
    var y = null;
    try { y = candles.priceToCoordinate(lastClose); } catch (e) { y = null; }
    if (y == null) { cdEl.style.display = 'none'; return; }
    var left = Math.max(0, Math.round(barCloseAt - (Date.now() / 1000)));
    cdEl.textContent = fmtCountdown(left);
    // Under the live price label rather than over it.
    cdEl.style.top = Math.round(y + 9) + 'px';
    // Warn in the last 10% of the bar, floored at 10s.
    cdEl.className = left <= 10 ? 'closing' : '';
    cdEl.style.display = 'block';
  }
  setInterval(drawCountdown, 1000);
  chart.timeScale().subscribeVisibleLogicalRangeChange(drawCountdown);
  function ensureStoch() {
    if (stochK) return;
    stochK = chart.addSeries(LWC.LineSeries, {
      color: '#E3B84C', lineWidth: 1,
      priceLineVisible: false, lastValueVisible: false
    }, 1);
    stochD = chart.addSeries(LWC.LineSeries, {
      color: '#35CDAC', lineWidth: 1,
      priceLineVisible: false, lastValueVisible: false
    }, 1);
    try {
      var panes = chart.panes();
      if (panes[1] && panes[1].setStretchFactor) panes[1].setStretchFactor(0.25);
    } catch (e) { /* pane sizing is cosmetic */ }
  }

  // Android registers a GmpErr JavaScript channel; report engine errors
  // so the app can fall back to the native chart renderer.
  window.onerror = function (msg) {
    try {
      if (window.GmpErr && window.GmpErr.postMessage) {
        window.GmpErr.postMessage(String(msg));
      }
    } catch (e) { /* never let error reporting throw */ }
  };

  // Web embeds this page in a same-origin iframe and drives it via
  // postMessage; Android calls window.gmp directly through the WebView.
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (d && d.type === 'setAll' && window.gmp) {
      window.gmp.setAll(d.json, !!d.fit);
    }
  });

  window.gmp = {
    setAll: function (json, fit) {
      var d = JSON.parse(json);
      candles.setData(d.candles || []);
      volume.setData(d.volume || []);
      for (var i = 0; i < 3; i++) {
        smma[i].setData((d.smma && d.smma[i]) || []);
      }
      var readout = document.getElementById('readout');
      if (d.stochK && d.stochK.length) {
        ensureStoch();
        stochK.setData(d.stochK);
        stochD.setData(d.stochD || []);
        // Live numeric read-out on the chart itself.
        var kv = d.stochK[d.stochK.length - 1].value;
        var dv = (d.stochD && d.stochD.length)
          ? d.stochD[d.stochD.length - 1].value : null;
        readout.innerHTML = 'StochRSI '
          + '<span class="kv">%K ' + kv.toFixed(1) + '</span>'
          + (dv != null ? ' <span class="dv">%D ' + dv.toFixed(1) + '</span>' : '');
        readout.style.display = 'block';
      } else {
        if (stochK) { stochK.setData([]); stochD.setData([]); }
        readout.style.display = 'none';
      }
      var markers = d.markers || [];
      if (markersApi) markersApi.setMarkers(markers);
      else if (markers.length) markersApi = LWC.createSeriesMarkers(candles, markers);

      // Running-signal levels. Removed and recreated every update so a
      // ratcheting stop moves and a closed trade leaves nothing behind —
      // price lines have no "update the whole set" API.
      for (var p = 0; p < priceLines.length; p++) {
        try { candles.removePriceLine(priceLines[p]); } catch (e) {}
      }
      priceLines = [];
      var lines = d.priceLines || [];
      for (var q = 0; q < lines.length; q++) {
        var L = lines[q];
        if (L == null || typeof L.price !== 'number' || !isFinite(L.price)) continue;
        priceLines.push(candles.createPriceLine({
          price: L.price,
          color: L.color || '#E3B84C',
          lineWidth: 1,
          lineStyle: L.style === 0 ? LWC.LineStyle.Solid : LWC.LineStyle.Dashed,
          axisLabelVisible: true,
          title: L.title || ''
        }));
      }
      barCloseAt = (typeof d.barCloseAt === 'number') ? d.barCloseAt : null;
      var cs = d.candles || [];
      lastClose = cs.length ? cs[cs.length - 1].close : null;
      drawCountdown();

      if (fit) chart.timeScale().fitContent();
      return 'ok:' + (d.candles ? d.candles.length : 0);
    }
  };
})();
</script>
</body>
</html>
